<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>需求表管理｜宇德</title>
<link rel="icon" href="../favicon.ico">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="schema.js?v=20260923c"></script>
<script src="form-ui.js?v=20260923c"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Noto Sans TC', 'PingFang TC', '微軟正黑體', sans-serif; background: #ede8e0; color: #3a2e24; min-height: 100vh; }
  header { background: #5c4a35; color: #f5ede2; padding: 14px 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  header h1 { font-size: 17px; font-weight: 600; letter-spacing: 0.06em; flex: 1; white-space: nowrap; }
  header a, header button { color: #f5ede2; font-size: 13px; background: none; border: 1px solid #8a7060; border-radius: 6px; padding: 5px 10px; cursor: pointer; text-decoration: none; font-family: inherit; }
  #who { font-size: 12px; color: #c4a882; }
  main { max-width: 1200px; margin: 0 auto; padding: 16px; }
  .login { max-width: 380px; margin: 12vh auto; background: #faf6f0; border: 1px solid #ddd0bc; border-radius: 12px; padding: 28px; text-align: center; }
  .login p { font-size: 13px; color: #8a7060; margin: 10px 0 18px; line-height: 1.7; }
  .btn { font-family: inherit; font-size: 14px; padding: 9px 18px; border-radius: 8px; border: none; background: #5c4a35; color: #f5ede2; cursor: pointer; }
  .btn:disabled { background: #c4b09a; cursor: not-allowed; }
  .btn.ghost { background: #fff8f2; color: #5c4a35; border: 1px solid #d5c4ae; }
  .err { color: #8c3a1c; font-size: 13px; margin-top: 12px; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .toolbar input, .toolbar select, .detail select, .detail textarea { font-family: inherit; font-size: 14px; padding: 7px 10px; border: 1px solid #d5c4ae; border-radius: 8px; background: #fff8f2; color: #3a2e24; }
  .toolbar input { flex: 1; min-width: 160px; }
  .count { font-size: 13px; color: #8a7060; }
  .layout { display: grid; grid-template-columns: minmax(280px, 380px) 1fr; gap: 16px; align-items: start; }
  @media (max-width: 800px) { .layout { grid-template-columns: 1fr; } }
  .list { display: flex; flex-direction: column; gap: 8px; }
  .item { background: #faf6f0; border: 1px solid #ddd0bc; border-radius: 10px; padding: 12px 14px; cursor: pointer; text-align: left; font-family: inherit; color: inherit; width: 100%; }
  .item:hover { border-color: #a07850; }
  .item.active { border-color: #5c4a35; box-shadow: 0 0 0 1px #5c4a35; }
  .item-top { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .item-name { font-weight: 600; font-size: 15px; }
  .item-sub { font-size: 12px; color: #8a7060; margin-top: 4px; line-height: 1.6; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; white-space: nowrap; }
  .s-new { background: #f6e3cf; color: #8c4a12; }
  .s-contacted { background: #e3ecf6; color: #2a4f7a; }
  .s-quoted { background: #ece3f6; color: #5a3a7a; }
  .s-won { background: #e3f1dc; color: #3d6b2a; }
  .s-lost { background: #e8e4df; color: #6f655b; }
  .detail { background: #faf6f0; border: 1px solid #ddd0bc; border-radius: 12px; padding: 20px; }
  .detail h2 { font-size: 20px; margin-bottom: 4px; }
  .meta { font-size: 12px; color: #8a7060; margin-bottom: 16px; line-height: 1.7; }
  .manage { display: grid; grid-template-columns: 160px 1fr; gap: 10px; background: #f3ece2; border-radius: 10px; padding: 12px; margin-bottom: 18px; }
  .manage textarea { width: 100%; min-height: 60px; resize: vertical; }
  .manage .actions { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  @media (max-width: 560px) { .manage { grid-template-columns: 1fr; } }
  .sec { margin-bottom: 16px; }
  .sec h3 { font-size: 13px; color: #5c4a35; border-left: 3px solid #a07850; padding-left: 8px; margin-bottom: 8px; }
  dl { display: grid; grid-template-columns: 170px 1fr; gap: 6px 12px; font-size: 14px; }
  dt { color: #8a7060; }
  dd { white-space: pre-wrap; word-break: break-word; }
  @media (max-width: 560px) { dl { grid-template-columns: 1fr; } dt { margin-top: 6px; } }
  .empty { color: #8a7060; font-size: 14px; padding: 30px; text-align: center; }
  .chip { font-size: 11px; padding: 1px 7px; border-radius: 10px; background: #efe6d8; color: #7a6248; margin-left: 6px; white-space: nowrap; font-weight: 400; }
  .notice { font-size: 13px; background: #fff4e0; border: 1px solid #ecd3a8; color: #7a4f12; border-radius: 8px; padding: 8px 12px; margin-bottom: 12px; line-height: 1.6; }
  .linkrow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 13px; background: #f3ece2; border-radius: 10px; padding: 10px 12px; margin-bottom: 14px; }
  .linkrow input { flex: 1; min-width: 180px; font-size: 12px; padding: 6px 8px; border: 1px solid #d5c4ae; border-radius: 6px; background: #fff8f2; }
  .btn.sm { font-size: 12px; padding: 6px 10px; }
  .btn.danger { color: #9a3b1f; border-color: #e3bfae; margin-left: auto; }
  .history { font-size: 13px; }
  .history li { list-style: none; border-left: 2px solid #d5c4ae; padding: 4px 0 8px 10px; }
  .history .h-meta { color: #8a7060; font-size: 12px; }
  .history pre { white-space: pre-wrap; font-family: inherit; margin-top: 2px; }
  .related a { color: #5c4a35; }
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .tabs button { font-family: inherit; font-size: 12px; padding: 5px 10px; border-radius: 14px; border: 1px solid #d5c4ae; background: #fff8f2; color: #5c4a35; cursor: pointer; }
  .tabs button.on { background: #5c4a35; color: #f5ede2; border-color: #5c4a35; }
  #edit-form .form-section { background: #fff; border: 1px solid #ddd0bc; border-radius: 10px; padding: 14px; margin-bottom: 10px; }
  #edit-form .section-title { font-size: 13px; font-weight: 600; color: #5c4a35; margin-bottom: 10px; border-left: 3px solid #a07850; padding-left: 8px; }
  #edit-form .field-row { display: grid; grid-template-columns: repeat(var(--cols, 1), 1fr); gap: 10px; margin-bottom: 10px; }
  @media (max-width: 560px) { #edit-form .field-row { grid-template-columns: 1fr; } }
  #edit-form .field-group { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  #edit-form .field-label { font-size: 12px; color: #8a7060; }
  #edit-form .req { color: #b4532a; }
  #edit-form input[type=text], #edit-form input[type=tel], #edit-form input[type=email], #edit-form input[type=number], #edit-form input[type=date], #edit-form select, #edit-form textarea { font-family: inherit; font-size: 14px; padding: 7px 10px; border: 1px solid #d5c4ae; border-radius: 8px; background: #fff8f2; color: #3a2e24; width: 100%; }
  #edit-form textarea { min-height: 80px; resize: vertical; }
  #edit-form .pill-group { display: flex; flex-wrap: wrap; gap: 6px; }
  #edit-form .pill { display: flex; align-items: center; gap: 5px; font-size: 12px; cursor: pointer; padding: 4px 10px; border: 1px solid #d5c4ae; border-radius: 16px; background: #fff8f2; color: #5c4a35; }
  #edit-form .pill:has(input:checked) { background: #5c4a35; border-color: #5c4a35; color: #f5ede2; }
  #edit-form .pill input { accent-color: #a07850; }
  #edit-form .other-input { margin-top: 6px; }
  #edit-form .budget-wrap { display: flex; align-items: center; gap: 10px; }
  #edit-form .budget-wrap input[type=range] { flex: 1; min-width: 0; accent-color: #a07850; }
  #edit-form .budget-label, #edit-form .hint { font-size: 12px; color: #a08060; }
  #edit-form .budget-val { font-weight: 600; min-width: 56px; text-align: right; }
  .edit-actions { position: sticky; bottom: 0; background: #faf6f0; padding: 10px 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  @media print {
    header, .toolbar, .list, .manage .actions, .no-print, .linkrow, .tabs { display: none !important; }
    body { background: #fff; }
    .layout { display: block; }
    .detail { border: none; padding: 0; }
  }
</style>
</head>
<body>
<header>
  <h1>住宅裝修需求表・管理</h1>
  <span id="who"></span>
  <a href="./" target="_blank" rel="noopener">開啟客戶填寫頁</a>
  <button id="logout-btn" hidden>登出</button>
</header>

<main>
  <div class="login" id="login-box">
    <strong>宇德內部使用</strong>
    <p>請用 @yutesign.com Google 帳號登入<br>查看客戶送出的需求表。</p>
    <button class="btn" id="login-btn">Google 登入</button>
    <div class="err" id="login-err"></div>
  </div>

  <div id="app" hidden>
    <div class="toolbar">
      <input id="q" type="search" placeholder="搜尋姓名、電話、地址、備註…">
      <select id="status-filter"><option value="">全部狀態</option></select>
      <span class="count" id="count"></span>
    </div>
    <div class="layout">
      <div class="list" id="list"></div>
      <div class="detail" id="detail"><div class="empty">請從左側選擇一筆需求表</div></div>
    </div>
  </div>
</main>

<script>
const GOOGLE_CLIENT_ID = '239869421522-cqs68t3pnahjbmv9ld1k08b4p79s34k4.apps.googleusercontent.com';
const DAY_MS = 86400000;
let leads = [];
let selectedId = '';
let dbRef = null;
let tokenClient = null;
let editing = false;
let showOriginal = false;
let editInfo = { token: '', expiresAt: 0, loaded: false };

firebase.initializeApp(LEAD_FIREBASE_CONFIG);
const statusLabel = v => LEAD_STATUSES.find(s => s.value === v)?.label || v || '新進';
const fmtTime = ms => ms ? new Date(ms).toLocaleString('zh-TW', { hour12: false }) : '';
const currentForm = l => l.current?.form || l.form || {};
const phoneKey = p => {
  let d = String(p || '').replace(/\D/g, '');
  if (d.startsWith('886')) d = '0' + d.slice(3);
  return d.length >= 8 ? d : '';
};

document.getElementById('status-filter').insertAdjacentHTML('beforeend',
  LEAD_STATUSES.map(s => `<option value="${s.value}">${s.label}</option>`).join(''));

function setLoginError(msg) { document.getElementById('login-err').textContent = msg; }

function initGoogle() {
  if (!window.google?.accounts?.oauth2) { setTimeout(initGoogle, 300); return; }
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: 'https://www.googleapis.com/auth/userinfo.email',
    callback: async resp => {
      if (resp.error) { setLoginError('Google 授權失敗，請再試一次。'); return; }
      try {
        const credential = firebase.auth.GoogleAuthProvider.credential(null, resp.access_token);
        await firebase.auth().signInWithCredential(credential);
      } catch (e) {
        console.warn(e);
        setLoginError('登入驗證失敗，請確認網路與 Google 帳號狀態。');
      }
    },
  });
}

document.getElementById('login-btn').onclick = () => {
  setLoginError('');
  if (!tokenClient) { setLoginError('Google 登入模組載入中，請稍候再按一次。'); return; }
  tokenClient.requestAccessToken({ prompt: 'select_account' });
};
document.getElementById('logout-btn').onclick = () => firebase.auth().signOut();

firebase.auth().onAuthStateChanged(async user => {
  if (dbRef) { dbRef.off(); dbRef = null; }
  const email = String(user?.email || '').toLowerCase();
  const ok = !!user && user.emailVerified && /^[^@]+@yutesign\.com$/.test(email);
  if (user && !ok) {
    setLoginError(`此帳號無權限：${email || '未知帳號'}。請改用 @yutesign.com 帳號。`);
    await firebase.auth().signOut();
    return;
  }
  document.getElementById('login-box').hidden = ok;
  document.getElementById('app').hidden = !ok;
  document.getElementById('logout-btn').hidden = !ok;
  document.getElementById('who').textContent = ok ? email : '';
  if (!ok) { leads = []; selectedId = ''; return; }
  dbRef = firebase.database().ref(LEAD_DB_PATH);
  dbRef.on('value', snap => {
    const val = snap.val() || {};
    leads = Object.entries(val).map(([id, v]) => ({ id, ...v })).sort((a, b) => (b.submittedAt || 0) - (a.submittedAt || 0));
    renderList();
    if (!editing) renderDetail();
  }, err => {
    console.warn(err);
    document.getElementById('list').innerHTML = `<div class="empty">讀取失敗：${leadEscape(err.code || err.message)}<br>請確認 Firebase 規則已發布 leads 區段。</div>`;
  });
});

function samePhoneLeads(l) {
  const key = phoneKey(currentForm(l).phone || l.phone);
  return key ? leads.filter(x => x.id !== l.id && phoneKey(currentForm(x).phone || x.phone) === key) : [];
}

function filteredLeads() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const st = document.getElementById('status-filter').value;
  return leads.filter(l => {
    if (st && (l.status || 'new') !== st) return false;
    if (!q) return true;
    return [l.name, l.phone, l.staffNote, ...Object.values(l.form || {}), ...Object.values(currentForm(l))].join(' ').toLowerCase().includes(q);
  });
}

function renderList() {
  const rows = filteredLeads();
  document.getElementById('count').textContent = `共 ${rows.length} 筆` + (rows.length !== leads.length ? `（全部 ${leads.length}）` : '');
  document.getElementById('list').innerHTML = rows.length ? rows.map(l => {
    const f = currentForm(l);
    const st = l.status || 'new';
    const dup = samePhoneLeads(l).length;
    const chips = (dup ? `<span class="chip">同電話共 ${dup + 1} 張</span>` : '') + (l.current ? `<span class="chip">已修改</span>` : '');
    const sub = [f.address, [f.houseType, f.area && f.area + '坪', f.renoType].filter(Boolean).join('・'), f.budget && '預算 ' + f.budget].filter(Boolean);
    return `<button class="item ${l.id === selectedId ? 'active' : ''}" data-id="${leadEscape(l.id)}">
      <div class="item-top"><span class="item-name">${leadEscape(f.name || l.name)}${chips}</span><span class="badge s-${leadEscape(st)}">${leadEscape(statusLabel(st))}</span></div>
      <div class="item-sub">${leadEscape(f.phone || l.phone)}　${leadEscape(fmtTime(l.submittedAt))}<br>${sub.map(leadEscape).join('<br>')}</div>
    </button>`;
  }).join('') : '<div class="empty">目前沒有符合的需求表</div>';
}

function formSectionsHtml(f) {
  const html = LEAD_SECTIONS.map(s => {
    const items = [];
    s.fields.forEach(fd => {
      if (f[fd.key]) items.push(`<dt>${leadEscape(LEAD_FIELD_LABELS[fd.key])}</dt><dd>${leadEscape(f[fd.key])}</dd>`);
      if (fd.other && f[fd.other.key]) items.push(`<dt>${leadEscape(LEAD_FIELD_LABELS[fd.other.key])}</dt><dd>${leadEscape(f[fd.other.key])}</dd>`);
    });
    return items.length ? `<div class="sec"><h3>${leadEscape(s.title)}</h3><dl>${items.join('')}</dl></div>` : '';
  }).join('');
  return html || '<div class="empty">此筆沒有其他填寫內容</div>';
}

function byLabel(by) { return by === 'customer' ? '客戶本人' : by; }

async function loadEditInfo(l) {
  editInfo = { token: l.editToken || '', expiresAt: 0, loaded: !l.editToken };
  if (!l.editToken) return;
  try {
    const snap = await firebase.database().ref(`${LEAD_EDIT_PATH}/${l.editToken}/expiresAt`).get();
    if (selectedId !== l.id) return;
    editInfo = { token: l.editToken, expiresAt: snap.val() || 0, loaded: true };
  } catch (e) {
    console.warn(e);
    editInfo.loaded = true;
  }
  if (!editing) renderDetail();
}

function renderDetail() {
  const box = document.getElementById('detail');
  const l = leads.find(x => x.id === selectedId);
  if (!l) { box.innerHTML = '<div class="empty">請從左側選擇一筆需求表</div>'; return; }
  const f = currentForm(l);
  const handled = l.handledBy ? `・最後處理：${leadEscape(l.handledBy)}（${leadEscape(fmtTime(l.handledAt))}）` : '';
  const changed = l.current ? `<div class="notice">${leadEscape(byLabel(l.current.updatedBy))} 於 ${leadEscape(fmtTime(l.current.updatedAt))} 修改過內容，下方顯示最新版本；原始填寫內容仍保留。</div>` : '';
  const related = samePhoneLeads(l);
  const relatedHtml = related.length ? `<div class="notice related">同一支電話另有 ${related.length} 張需求表：${related.map(r => `<a href="#" data-goto="${leadEscape(r.id)}">${leadEscape(fmtTime(r.submittedAt))}（${leadEscape(statusLabel(r.status))}）</a>`).join('、')}</div>` : '';
  let linkHtml = '';
  if (l.editToken) {
    const url = leadEditUrl(l.editToken);
    const expired = editInfo.loaded && editInfo.expiresAt <= Date.now();
    const state = !editInfo.loaded ? '讀取中…' : expired ? `已於 ${fmtTime(editInfo.expiresAt)} 失效` : `有效至 ${fmtTime(editInfo.expiresAt)}`;
    linkHtml = `<div class="linkrow"><span>客戶修改連結（${leadEscape(state)}）</span>
      <input readonly value="${leadEscape(url)}">
      <button class="btn ghost sm" data-act="copy">複製</button>
      <button class="btn ghost sm" data-act="extend">重新開放 ${LEAD_EDIT_DAYS} 天</button></div>`;
  }
  const history = Object.values(l.history || {}).sort((a, b) => (b.at || 0) - (a.at || 0));
  const historyHtml = history.length ? `<div class="sec"><h3>修改紀錄</h3><ul class="history">${history.map(h => `<li><div class="h-meta">${leadEscape(fmtTime(h.at))}・${leadEscape(byLabel(h.by))}</div><pre>${leadEscape(h.changes)}</pre></li>`).join('')}</ul></div>` : '';
  const tabs = l.current ? `<div class="tabs"><button data-act="view-current" class="${showOriginal ? '' : 'on'}">最新內容</button><button data-act="view-original" class="${showOriginal ? 'on' : ''}">原始填寫</button></div>` : '';
  box.innerHTML = `
    <h2>${leadEscape(f.name || l.name)}</h2>
    <div class="meta">送出時間：${leadEscape(fmtTime(l.submittedAt))}${handled}<br>表單版本：${leadEscape(l.formVersion || '')}</div>
    ${relatedHtml}${changed}
    <div class="manage">
      <select id="d-status">${LEAD_STATUSES.map(s => `<option value="${s.value}" ${s.value === (l.status || 'new') ? 'selected' : ''}>${s.label}</option>`).join('')}</select>
      <textarea id="d-note" maxlength="2000" placeholder="內部備註（客戶看不到）">${leadEscape(l.staffNote || '')}</textarea>
      <div class="actions">
        <button class="btn" data-act="save-manage">儲存狀態與備註</button>
        <button class="btn ghost" data-act="edit">修改需求內容</button>
        <button class="btn ghost" onclick="window.print()">列印</button>
        <button class="btn ghost danger" data-act="delete">刪除</button>
        <span class="count" id="d-msg"></span>
      </div>
    </div>
    ${linkHtml}
    ${tabs}
    ${formSectionsHtml(showOriginal ? (l.form || {}) : f)}
    ${historyHtml}`;
}

function renderEditor() {
  const l = leads.find(x => x.id === selectedId);
  if (!l) return;
  editing = true;
  const box = document.getElementById('detail');
  box.innerHTML = `<h2>修改：${leadEscape(currentForm(l).name || l.name)}</h2>
    <div class="notice">代客戶修改內容。儲存後會記錄修改人與變更內容，原始填寫內容不會被覆蓋。</div>
    <div id="edit-form"></div>
    <div class="edit-actions">
      <button class="btn" data-act="save-edit">儲存修改</button>
      <button class="btn ghost" data-act="cancel-edit">取消</button>
      <span class="count" id="e-msg"></span>
    </div>`;
  const root = document.getElementById('edit-form');
  renderLeadForm(root);
  setLeadValues(root, currentForm(l));
}

async function saveEdit() {
  const l = leads.find(x => x.id === selectedId);
  const msg = document.getElementById('e-msg');
  const values = collectLeadValues(document.getElementById('edit-form'));
  if (!values.name || !values.phone) { msg.textContent = '姓名與電話不可空白'; return; }
  const changes = diffLeadForms(currentForm(l), values);
  if (!changes) { msg.textContent = '內容沒有變更'; return; }
  const email = firebase.auth().currentUser.email.toLowerCase();
  const TS = firebase.database.ServerValue.TIMESTAMP;
  const root = firebase.database().ref(LEAD_ROOT_PATH);
  const historyId = root.child(`items/${l.id}/history`).push().key;
  const updates = {
    [`items/${l.id}/current`]: { form: values, updatedAt: TS, updatedBy: email },
    [`items/${l.id}/history/${historyId}`]: { at: TS, by: email, changes },
  };
  if (l.editToken) {
    updates[`edits/${l.editToken}/form`] = values;
    updates[`edits/${l.editToken}/updatedAt`] = TS;
  }
  msg.textContent = '儲存中…';
  try {
    await root.update(updates);
    editing = false;
    showOriginal = false;
    renderDetail();
  } catch (e) {
    console.warn(e);
    msg.textContent = '儲存失敗：' + (e.code || e.message);
  }
}

async function saveManage() {
  const l = leads.find(x => x.id === selectedId);
  const msg = document.getElementById('d-msg');
  msg.textContent = '儲存中…';
  try {
    await firebase.database().ref(`${LEAD_DB_PATH}/${l.id}`).update({
      status: document.getElementById('d-status').value,
      staffNote: document.getElementById('d-note').value.trim(),
      handledBy: firebase.auth().currentUser.email.toLowerCase(),
      handledAt: firebase.database.ServerValue.TIMESTAMP,
    });
  } catch (e) {
    console.warn(e);
    const el = document.getElementById('d-msg');
    if (el) el.textContent = '儲存失敗：' + (e.code || e.message);
  }
}

async function deleteLead() {
  const l = leads.find(x => x.id === selectedId);
  if (!l) return;
  const name = currentForm(l).name || l.name;
  const typed = prompt(`確定要永久刪除「${name}」這張需求表嗎？\n刪除後無法復原，修改紀錄與客戶修改連結也會一併刪除。\n\n請輸入客戶姓名「${name}」確認：`);
  if (typed === null) return;
  if (typed.trim() !== name) { alert('輸入的姓名不符，未刪除。'); return; }
  const updates = { [`items/${l.id}`]: null };
  if (l.editToken) updates[`edits/${l.editToken}`] = null;
  try {
    await firebase.database().ref(LEAD_ROOT_PATH).update(updates);
    selectedId = '';
    renderList();
    renderDetail();
  } catch (e) {
    console.warn(e);
    alert('刪除失敗：' + (e.code || e.message));
  }
}

async function extendLink() {
  const l = leads.find(x => x.id === selectedId);
  if (!l?.editToken) return;
  const expiresAt = Date.now() + LEAD_EDIT_DAYS * DAY_MS;
  try {
    await firebase.database().ref(`${LEAD_EDIT_PATH}/${l.editToken}/expiresAt`).set(expiresAt);
    editInfo = { token: l.editToken, expiresAt, loaded: true };
    renderDetail();
  } catch (e) {
    console.warn(e);
    alert('重新開放失敗：' + (e.code || e.message));
  }
}

function selectLead(id) {
  if (editing && !confirm('尚未儲存的修改會遺失，確定要離開嗎？')) return;
  editing = false;
  showOriginal = false;
  selectedId = id;
  renderList();
  renderDetail();
  const l = leads.find(x => x.id === id);
  if (l) loadEditInfo(l);
  if (window.innerWidth <= 800) document.getElementById('detail').scrollIntoView({ behavior: 'smooth' });
}

document.getElementById('list').addEventListener('click', e => {
  const item = e.target.closest('.item');
  if (item) selectLead(item.dataset.id);
});
document.getElementById('detail').addEventListener('click', e => {
  const go = e.target.closest('[data-goto]');
  if (go) { e.preventDefault(); selectLead(go.dataset.goto); return; }
  const act = e.target.closest('[data-act]')?.dataset.act;
  if (!act) return;
  if (act === 'save-manage') saveManage();
  else if (act === 'edit') renderEditor();
  else if (act === 'save-edit') saveEdit();
  else if (act === 'cancel-edit') { editing = false; renderDetail(); }
  else if (act === 'view-current') { showOriginal = false; renderDetail(); }
  else if (act === 'view-original') { showOriginal = true; renderDetail(); }
  else if (act === 'extend') extendLink();
  else if (act === 'delete') deleteLead();
  else if (act === 'copy') {
    const input = e.target.closest('.linkrow').querySelector('input');
    navigator.clipboard.writeText(input.value).then(() => { e.target.textContent = '已複製'; }, () => input.select());
  }
});
document.getElementById('q').addEventListener('input', renderList);
document.getElementById('status-filter').addEventListener('change', renderList);
initGoogle();
</script>
