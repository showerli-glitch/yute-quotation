<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>裝修需求表｜宇德室內裝修股份有限公司</title>
<link rel="icon" href="../favicon.ico">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="schema.js?v=20260923b"></script>
<script src="form-ui.js?v=20260923b"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Noto Sans TC', 'PingFang TC', '微軟正黑體', sans-serif; background: #ede8e0; color: #3a2e24; min-height: 100vh; padding: 2rem 1rem; }
  .page-wrap { max-width: 720px; margin: 0 auto; }
  .page-header { text-align: center; margin-bottom: 2rem; padding: 2.5rem 1.5rem; background: #5c4a35; border-radius: 14px; color: #fff; }
  .page-header .company { font-size: 12px; letter-spacing: 0.2em; color: #c4a882; margin-bottom: 10px; }
  .page-header h1 { font-size: 26px; font-weight: 600; letter-spacing: 0.08em; color: #f5ede2; }
  .page-header p { font-size: 13px; color: #a8917a; margin-top: 8px; }
  .form-section { background: #faf6f0; border: 1px solid #ddd0bc; border-radius: 12px; padding: 1.5rem; margin-bottom: 1rem; }
  .section-title { font-size: 14px; font-weight: 600; color: #5c4a35; margin-bottom: 1.25rem; display: flex; align-items: center; gap: 8px; letter-spacing: 0.05em; }
  .section-title::before { content: ''; display: block; width: 3px; height: 16px; background: #a07850; border-radius: 2px; }
  .field-row { display: grid; grid-template-columns: repeat(var(--cols, 1), 1fr); gap: 12px; margin-bottom: 14px; }
  @media (max-width: 560px) { .field-row { grid-template-columns: 1fr; } body { padding: 1rem; } .form-section { padding: 1.25rem 1rem; } }
  .field-group { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .field-label { font-size: 12px; color: #8a7060; font-weight: 500; letter-spacing: 0.03em; }
  .req { color: #b4532a; margin-left: 2px; }
  input[type=text], input[type=tel], input[type=email], input[type=number], input[type=date], select, textarea { font-family: inherit; font-size: 16px; padding: 9px 12px; border: 1px solid #d5c4ae; border-radius: 8px; background: #fff8f2; color: #3a2e24; width: 100%; transition: border-color 0.15s; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: #a07850; background: #fff; }
  .invalid input, .invalid select { border-color: #b4532a; background: #fff3ee; }
  textarea { resize: vertical; min-height: 90px; line-height: 1.6; }
  .pill-group { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .pill { display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; padding: 6px 12px; border: 1px solid #d5c4ae; border-radius: 20px; background: #fff8f2; color: #5c4a35; user-select: none; transition: all 0.15s; }
  .pill:hover { border-color: #a07850; background: #f5ede2; }
  .pill input { width: 14px; height: 14px; margin: 0; flex-shrink: 0; accent-color: #a07850; }
  .pill:has(input:checked) { background: #5c4a35; border-color: #5c4a35; color: #f5ede2; }
  .budget-wrap { display: flex; align-items: center; gap: 12px; margin-top: 4px; }
  .budget-wrap input[type=range] { flex: 1; accent-color: #a07850; min-width: 0; }
  .budget-label { font-size: 13px; color: #a08060; white-space: nowrap; }
  .budget-val { font-size: 15px; font-weight: 600; min-width: 64px; text-align: right; color: #5c4a35; }
  .hint { font-size: 12px; color: #b09a80; margin-top: 4px; }
  .consent { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: #5c4a35; line-height: 1.6; cursor: pointer; }
  .consent input { margin-top: 4px; accent-color: #a07850; }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
  .submit-btn { width: 100%; padding: 14px; font-size: 15px; font-weight: 600; font-family: inherit; letter-spacing: 0.08em; border-radius: 10px; border: none; background: #5c4a35; color: #f5ede2; cursor: pointer; transition: background 0.15s; margin-top: 0.5rem; }
  .submit-btn:hover { background: #7a6248; }
  .submit-btn:disabled { background: #c4b09a; cursor: not-allowed; }
  .status-msg { display: none; font-size: 14px; padding: 12px 16px; border-radius: 8px; margin-bottom: 12px; text-align: center; line-height: 1.6; }
  .status-msg.success { display: block; background: #eef5e8; color: #3d6b2a; border: 1px solid #c5ddb0; }
  .status-msg.error { display: block; background: #fbeee8; color: #8c3a1c; border: 1px solid #e8c2b0; }
  .done { text-align: center; padding: 3rem 1.5rem; }
  .done h2 { font-size: 20px; color: #5c4a35; margin-bottom: 10px; }
  .done p { font-size: 14px; color: #8a7060; line-height: 1.8; }
  .page-footer { text-align: center; font-size: 12px; color: #b09a80; margin-top: 1.5rem; padding-bottom: 1rem; }
  .other-input { margin-top: 8px; }
  .link-box { display: flex; gap: 8px; margin: 16px auto 0; max-width: 520px; }
  .link-box input { font-size: 13px; flex: 1; min-width: 0; }
  .link-box button { font-family: inherit; font-size: 13px; padding: 0 14px; border-radius: 8px; border: 1px solid #a07850; background: #fff8f2; color: #5c4a35; cursor: pointer; white-space: nowrap; }
  .edit-banner { background: #f5ede2; border: 1px solid #ddd0bc; border-radius: 10px; padding: 12px 16px; font-size: 13px; color: #5c4a35; line-height: 1.7; margin-bottom: 1rem; }
</style>
</head>
<body>
<div class="page-wrap">
  <div class="page-header">
    <div class="company">宇德室內裝修股份有限公司</div>
    <h1 id="page-title">住宅裝修需求表</h1>
    <p id="page-sub">請填寫以下資料，我們將盡快與您聯繫</p>
  </div>

  <div class="form-section done" id="loading" hidden><p>讀取中…</p></div>
  <div class="form-section done" id="invalid" hidden>
    <h2>此修改連結已失效</h2>
    <p>修改連結在送出後 7 天內有效。<br>如需修改或補充需求，請直接來電或透過 LINE 與宇德聯繫，<br>或<a href="./">重新填寫一份需求表</a>。</p>
  </div>

  <form id="lead-form" novalidate>
    <div class="edit-banner" id="edit-banner" hidden></div>
    <div id="sections"></div>
    <div class="form-section">
      <label class="consent" id="consent-row">
        <input type="checkbox" id="f-consent">
        <span>我同意宇德室內裝修股份有限公司蒐集並使用以上資料，僅用於本次裝修需求的聯繫、評估與報價，不會提供給無關第三方。<span class="req">*</span></span>
      </label>
    </div>
    <div class="hp" aria-hidden="true"><label>網站<input type="text" id="f-website" tabindex="-1" autocomplete="off"></label></div>
    <div class="status-msg" id="status-msg" role="status"></div>
    <button type="submit" class="submit-btn" id="submit-btn">送出需求表</button>
  </form>

  <div class="form-section done" id="done" hidden>
    <h2 id="done-title">已收到您的需求表</h2>
    <p id="done-text">感謝您的填寫，宇德會盡快與您聯繫。<br>若有平面圖或參考照片，可在聯繫時一併提供。</p>
    <div id="done-link" hidden>
      <p style="margin-top:18px">若填錯或想補充需求，<strong>7 天內</strong>可用下面這個專屬連結修改：<br>（請自行保存，此連結不會再顯示；請勿轉傳給他人）</p>
      <div class="link-box"><input type="text" id="edit-link" readonly><button type="button" id="copy-link">複製連結</button></div>
    </div>
  </div>

  <div class="page-footer">© 宇德室內裝修股份有限公司　資料僅供聯繫使用</div>
</div>

<script>
const openedAt = Date.now();
const editToken = new URLSearchParams(location.search).get('edit') || '';
const formEl = document.getElementById('lead-form');
const sectionsEl = document.getElementById('sections');
let editRecord = null;

function db() {
  if (!firebase.apps.length) firebase.initializeApp(LEAD_FIREBASE_CONFIG);
  return firebase.database();
}

function markInvalid(key, bad) {
  sectionsEl.querySelector(`[data-key="${key}"]`)?.classList.toggle('invalid', bad);
}

function showStatus(type, text) {
  const el = document.getElementById('status-msg');
  el.className = 'status-msg ' + type;
  el.textContent = text;
}

function validate(values) {
  const problems = [];
  const nameBad = !values.name;
  const phoneBad = !values.phone || values.phone.replace(/\D/g, '').length < 8;
  const emailBad = !!values.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(values.email);
  markInvalid('name', nameBad); markInvalid('phone', phoneBad); markInvalid('email', emailBad);
  if (nameBad) problems.push('姓名');
  if (phoneBad) problems.push('聯絡電話');
  if (emailBad) problems.push('電子郵件格式');
  if (!document.getElementById('f-consent').checked) problems.push('同意資料使用');
  return problems;
}

function withTimeout(promise, ms) {
  return Promise.race([promise, new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), ms))]);
}

function showDone({ title, text, link }) {
  formEl.hidden = true;
  document.getElementById('done').hidden = false;
  if (title) document.getElementById('done-title').textContent = title;
  if (text) document.getElementById('done-text').textContent = text;
  if (link) {
    document.getElementById('done-link').hidden = false;
    document.getElementById('edit-link').value = link;
  }
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function createLead(values) {
  const root = db().ref(LEAD_ROOT_PATH);
  const leadId = root.child('items').push().key;
  const token = leadRandomToken();
  const TS = firebase.database.ServerValue.TIMESTAMP;
  await withTimeout(root.update({
    [`items/${leadId}`]: {
      name: values.name,
      phone: values.phone,
      status: 'new',
      source: 'yude-form-web',
      formVersion: LEAD_FORM_VERSION,
      submittedAt: TS,
      editToken: token,
      form: values,
    },
    [`edits/${token}`]: {
      leadId,
      expiresAt: Date.now() + LEAD_EDIT_DAYS * 86400000,
      form: values,
      updatedAt: TS,
    },
  }), 20000);
  showDone({ link: leadEditUrl(token) });
}

async function saveEdit(values) {
  const changes = diffLeadForms(editRecord.form, values);
  if (!changes) { showStatus('error', '內容沒有變更。'); return false; }
  const root = db().ref(LEAD_ROOT_PATH);
  const TS = firebase.database.ServerValue.TIMESTAMP;
  const leadId = editRecord.leadId;
  const historyId = root.child(`items/${leadId}/history`).push().key;
  await withTimeout(root.update({
    [`edits/${editToken}/form`]: values,
    [`edits/${editToken}/updatedAt`]: TS,
    [`items/${leadId}/current`]: { form: values, updatedAt: TS, updatedBy: 'customer', token: editToken },
    [`items/${leadId}/history/${historyId}`]: { at: TS, by: 'customer', changes, token: editToken },
  }), 20000);
  editRecord.form = values;
  showDone({ title: '已更新您的需求表', text: '修改內容已送出，宇德會依最新內容與您聯繫。', link: location.href });
  return true;
}

async function submitLead(event) {
  event.preventDefault();
  const btn = document.getElementById('submit-btn');
  const values = collectLeadValues(sectionsEl);
  const problems = validate(values);
  if (problems.length) {
    showStatus('error', '請確認：' + problems.join('、'));
    sectionsEl.querySelector('.invalid')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }
  // 機器人防護：隱藏欄位被填或秒送，不寫入資料庫
  if (!editToken && (document.getElementById('f-website').value || Date.now() - openedAt < 3000)) { showDone({}); return; }

  const label = btn.textContent;
  btn.disabled = true;
  btn.textContent = '送出中…';
  showStatus('', '');
  try {
    if (editToken) await saveEdit(values);
    else await createLead(values);
  } catch (e) {
    console.warn('lead submit failed:', e);
    const expired = editToken && editRecord && editRecord.expiresAt <= Date.now();
    showStatus('error', expired
      ? '修改期限已過，請直接來電或透過 LINE 與宇德聯繫。'
      : '送出失敗，請確認網路後再試一次；若持續失敗，請直接來電或透過 LINE 與我們聯繫。');
  }
  btn.disabled = false;
  btn.textContent = label;
}

async function startEditMode() {
  formEl.hidden = true;
  document.getElementById('loading').hidden = false;
  document.getElementById('page-title').textContent = '修改裝修需求表';
  document.getElementById('page-sub').textContent = '更新內容後按下「送出修改」即可';
  let snap = null;
  try {
    if (/^[A-Za-z0-9]{32}$/.test(editToken)) snap = await withTimeout(db().ref(`${LEAD_EDIT_PATH}/${editToken}`).get(), 20000);
  } catch (e) { console.warn('edit link read failed:', e); }
  document.getElementById('loading').hidden = true;
  if (!snap || !snap.exists()) { document.getElementById('invalid').hidden = false; return; }
  editRecord = snap.val();
  setLeadValues(sectionsEl, editRecord.form);
  document.getElementById('f-consent').checked = true;
  const until = new Date(editRecord.expiresAt).toLocaleString('zh-TW', { hour12: false, dateStyle: 'medium', timeStyle: 'short' });
  const banner = document.getElementById('edit-banner');
  banner.hidden = false;
  banner.textContent = `您正在修改先前送出的需求表，此連結可使用到 ${until}。原本填寫的內容宇德仍會保留，並記錄您修改了哪些地方。`;
  document.getElementById('submit-btn').textContent = '送出修改';
  formEl.hidden = false;
}

renderLeadForm(sectionsEl);
formEl.addEventListener('submit', submitLead);
formEl.addEventListener('input', e => {
  const key = e.target.closest('[data-key]')?.dataset.key;
  if (key) markInvalid(key, false);
});
document.getElementById('copy-link').addEventListener('click', async () => {
  const input = document.getElementById('edit-link');
  try { await navigator.clipboard.writeText(input.value); }
  catch { input.select(); document.execCommand('copy'); }
  document.getElementById('copy-link').textContent = '已複製';
});
if (editToken) startEditMode();
</script>
</body>
</html>
