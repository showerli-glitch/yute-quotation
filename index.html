<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宇德室內裝修 - 快速報價系統</title>
<link rel="icon" type="image/svg+xml" href="https://showerli-glitch.github.io/yute-quotation/favicon.svg?v=202606222000">
<link rel="icon" href="https://showerli-glitch.github.io/yute-quotation/favicon.ico?v=202606222000" sizes="any">
<link rel="icon" type="image/png" href="https://showerli-glitch.github.io/yute-quotation/favicon.png?v=202606222000">
<link rel="manifest" href="quotation.webmanifest?v=4c266bd2">
<meta name="theme-color" content="#123D33">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="宇德報價">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="quotation/icons/apple-touch-icon.png?v=4c266bd2">
<link rel="stylesheet" href="quotation/styles/quotation.css?v=4c266bd2">
<link rel="stylesheet" href="quotation/styles/mobile.css?v=4c266bd2">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="quotation/js/boot.js?v=4c266bd2"></script>
</head>
<body>

<!-- 登入驗證畫面 -->
<div id="loginScreen" style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#f5f4f0">
  <div style="background:#fff;border-radius:16px;padding:48px 40px;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,0.08);max-width:400px;width:90%">
    <div style="font-size:32px;margin-bottom:12px">🏠</div>
    <h1 style="font-size:20px;font-weight:700;color:#1a1a1a;margin-bottom:6px">宇德室內裝修</h1>
    <p style="font-size:14px;color:#888;margin-bottom:32px">報價系統</p>
    <button id="btnLogin" onclick="startLogin()" style="background:#4285f4;color:#fff;border:none;border-radius:8px;padding:14px 32px;font-size:15px;font-weight:600;cursor:pointer;width:100%">使用公司帳號登入</button>
    <p id="loginError" style="margin-top:16px;font-size:13px;color:#e53935;display:none"></p>
    <p style="margin-top:24px;font-size:12px;color:#bbb">僅限 @yutesign.com 帳號使用</p>
  </div>
</div>

<!-- 主系統畫面 -->
<div id="mainApp" style="display:none">
<div class="screen-ui">
<div class="layout">

<!-- LEFT PANEL -->
<div class="panel-left">
  <div class="logo">
    <div><h1>宇德室內裝修</h1><p id="modeLabel">報價模式</p></div>
    <div class="mode-toggle">
      <button class="mode-btn active" id="btnQuoteMode" onclick="setMode('quote')">報價</button>
      <button class="mode-btn" id="btnEditMode" onclick="setMode('edit')">編輯工項</button>
    </div>
  </div>
  <div class="search-area">
    <input type="text" id="searchInput" placeholder="搜尋工項名稱…" oninput="onSearch()">
  </div>
  <div class="cat-tabs" id="catTabs"></div>
  <div class="item-list" id="itemList"></div>
  <!-- Edit mode save bar -->
  <div id="editSaveBar" style="display:none">
    <div class="add-new-item">
      <div class="row">
        <input id="newItemName" placeholder="新增工項名稱" style="flex:1"/>
      </div>
      <div class="row">
        <input id="newItemUnit" placeholder="單位" style="width:60px"/>
        <input id="newItemPrice" placeholder="單價" type="number" style="width:90px"/>
        <select id="newItemCat" style="flex:1;font-size:12px;padding:5px 6px;border:1px solid #e0ddd5;border-radius:6px;outline:none"><option value="假設及拆運工程">假設及拆運工程</option><option value="水電／照明工程">水電／照明工程</option><option value="輕隔間及輕鋼架天花工程">輕隔間及輕鋼架天花工程</option><option value="泥作及貼磚工程">泥作及貼磚工程</option><option value="木作及系統櫃工程">木作及系統櫃工程</option><option value="門扇工程">門扇工程</option><option value="鋁窗工程">鋁窗工程</option><option value="鐵件及金屬工程">鐵件及金屬工程</option><option value="油漆工程">油漆工程</option><option value="地坪工程">地坪工程</option><option value="玻璃及貼膜工程">玻璃及貼膜工程</option><option value="廣告及招牌工程">廣告及招牌工程</option><option value="窗簾工程">窗簾工程</option><option value="空調工程">空調工程</option><option value="衛浴設備工程">衛浴設備工程</option><option value="廚具設備工程">廚具設備工程</option><option value="燈具、設備及其他工程">燈具、設備及其他工程</option><option value="施工區域完工後清潔工程">施工區域完工後清潔工程</option><option value="設計製圖費">設計製圖費</option>        </select>
        <button class="btn-add" onclick="addNewItemToDb()">新增</button>
      </div>
    </div>
    <div class="edit-save-row">
      <span class="edit-status" id="editStatus">工項資料庫 — 點選各項目可修改類別與單價</span>
      <button class="btn btn-primary" onclick="saveDb()" style="font-size:12px;padding:6px 14px">儲存變更</button>
    </div>
  </div>
</div>

<!-- RESIZER -->
<div class="resizer" id="panelResizer"></div>

<!-- RIGHT PANEL -->
<div class="panel-right">
  <!-- 同步通知橫條 -->
  <div id="syncBanner" style="display:none;background:#e65100;color:#fff;padding:9px 16px;margin:-24px -24px 16px -24px;align-items:center;gap:12px;font-size:13px;flex-wrap:wrap">
    <span style="flex:1">⚠️ 同事剛儲存了新版本，你目前的編輯尚未存檔</span>
    <button onclick="syncDismiss()" style="background:transparent;color:#fff;border:1px solid rgba(255,255,255,0.7);padding:4px 14px;border-radius:4px;cursor:pointer;white-space:nowrap">知道了</button>
  </div>
  <div class="right-top">
    <div class="project-info">
      <h2>工程報價單</h2>
      <div class="meta-row">
        <div class="meta-field"><label>工程名稱</label><input id="projName" placeholder="輸入工程名稱" style="min-width:300px"/></div>
        <div class="meta-field"><label>業主</label><input id="projClient" placeholder="業主姓名"/></div>
        <div class="meta-field"><label>工程地址</label><input id="projAddr" placeholder="工程地址" style="min-width:220px"/></div>
        <div class="meta-field"><label>日期</label><input id="projDate" type="date"/></div>
        <div class="meta-field"><label>管理費%</label><input id="mgmtFee" type="number" value="5" min="0" max="20" style="width:80px" onchange="renderQuote()"/></div>
        <div class="meta-field"><label>負責人Email</label><input id="projEmail" placeholder="shower.li@yutesign.com" style="min-width:200px" value="shower.li@yutesign.com"/></div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;padding:8px 12px;background:#f9f8f6;border-radius:6px;border:1px solid #e0ddd5;font-size:12px">
        <span style="color:#888;align-self:center;font-weight:500">附加項目：</span>
        <div style="display:flex;align-items:center;gap:4px">
          <label style="white-space:nowrap;color:#555">完工清潔</label>
          <select id="extraCleanMode" onchange="toggleCleanMode()" style="font-size:11px;padding:2px 4px;border:1px solid #ddd;border-radius:4px">
            <option value="unit">坪×單價</option>
            <option value="fixed">1式固定</option>
          </select>
          <span id="cleanUnitWrap" style="display:flex;align-items:center;gap:4px">
            <input id="extraCleanQty" type="number" value="0" min="0" style="width:60px" onchange="updateClean()" placeholder="坪">
            <span style="color:#888">×</span>
            <input id="extraCleanPrice" type="number" value="700" min="0" style="width:70px" onchange="updateClean()" placeholder="單價">
          </span>
          <span id="cleanFixedWrap" style="display:none;align-items:center;gap:4px">
            <input id="extraCleanFixed" type="number" value="0" min="0" style="width:90px" onchange="updateClean()" placeholder="固定金額">
          </span>
        </div>
        <div style="display:flex;align-items:center;gap:4px">
          <label style="white-space:nowrap;color:#555">設計製圖費</label>
          <select id="extraDesignMode" onchange="toggleDesignMode();renderQuote()" style="font-size:11px;padding:2px 4px;border:1px solid #ddd;border-radius:4px">
            <option value="fixed">固定金額</option>
            <option value="pct">%計價</option>
            <option value="unit">坪×單價</option>
          </select>
          <span id="designFixedWrap" style="display:flex;align-items:center;gap:4px">
            <input id="extraDesignFixed" type="number" value="0" min="0" style="width:90px" onchange="renderQuote()" placeholder="金額">
          </span>
          <span id="designPctWrap" style="display:none;align-items:center;gap:4px">
            <input id="extraDesignPct" type="number" value="0" min="0" max="100" step="0.5" style="width:60px" onchange="renderQuote()" placeholder="%">
            <span style="color:#888">%</span>
          </span>
          <span id="designUnitWrap" style="display:none;align-items:center;gap:4px">
            <input id="extraDesignQty" type="number" value="0" min="0" style="width:55px" onchange="renderQuote()" placeholder="坪">
            <span style="color:#888">×</span>
            <input id="extraDesignPrice" type="number" value="0" min="0" style="width:75px" onchange="renderQuote()" placeholder="單價">
          </span>
        </div>
        <div style="display:flex;flex-direction:column;gap:3px">
          <div style="display:flex;align-items:center;gap:4px">
            <label style="white-space:nowrap;color:#555">自訂費用</label>
            <button onclick="addMiscItem()" style="font-size:11px;padding:1px 8px;background:#fff7e0;border:1px solid #f0c040;border-radius:4px;cursor:pointer;color:#7a5c00">＋ 新增</button>
          </div>
          <div id="miscItemsList" style="display:flex;flex-direction:column;gap:3px"></div>
        </div>
        <div style="display:flex;align-items:center;gap:4px">
          <label style="white-space:nowrap;color:#555">工程保險費</label>
          <input id="extraInsurance" type="number" value="0" min="0" style="width:90px" onchange="renderQuote()" placeholder="0">
        </div>
      </div>
    </div>
  </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      
      
      
  </div>
  <div class="stats-row">
    <div class="stat-card"><div class="stat-label">工項數</div><div class="stat-value" id="statItems">0</div></div>
    <div class="stat-card"><div class="stat-label">工程小計</div><div class="stat-value" id="statSubtotal">$0</div></div>
    <div class="stat-card"><div class="stat-label">管理費</div><div class="stat-value" id="statMgmt">$0</div></div>
    <div class="stat-card"><div class="stat-label">含稅總價</div><div class="stat-value accent" id="statTotal">$0</div></div>
  </div>
  <div style="margin-bottom:10px;display:flex;gap:8px;align-items:center">
    <div style="position:relative;flex:1">
      <input id="quoteSearch" type="text" placeholder="搜尋報價單工項…" oninput="renderQuote()" style="width:100%;padding:7px 32px 7px 12px;border:1px solid #e0ddd5;border-radius:8px;font-size:13px;background:#fff;box-sizing:border-box;outline:none">
      <span id="quoteSearchClear" onclick="document.getElementById('quoteSearch').value='';renderQuote()" style="display:none;position:absolute;right:10px;top:50%;transform:translateY(-50%);cursor:pointer;color:#aaa;font-size:16px;line-height:1">×</span>
    </div>
    <button onclick="openSectionManager()" style="white-space:nowrap;padding:7px 14px;border:1px solid #e0ddd5;border-radius:8px;font-size:13px;background:#fff;cursor:pointer;color:#555">⚙ 大項管理</button>
  </div>
  <div class="top-bar">
    <div class="actions" style="gap:10px">
      <button class="btn" onclick="clearAll()" style="font-size:12px;color:#999">🗑 清除全部</button>
      <button class="btn" onclick="openDriveQuotes()" style="background:#f0f7ff;border-color:#b8d4f5;color:#1a5fb4;font-size:13px">☁️ 雲端開啟</button>
      <button class="btn" onclick="saveQuoteToDrive()" style="background:#f0fff4;border-color:#b8e4c5;color:#1a7a4a;font-size:13px">☁️ 雲端儲存</button>
      <button class="btn" onclick="importJSON()" style="font-size:12px;color:#777">匯入 JSON</button>
      <button class="btn" onclick="exportJSON()" style="font-size:12px;color:#777">下載 JSON 備份</button>
      <button class="btn btn-primary" onclick="doPrint()" style="font-size:14px;padding:10px 20px;letter-spacing:0.5px">🖨️ 列印 PDF</button>
      <button class="btn" onclick="exportToExcel()" style="background:#1a7a4a;color:#fff;border-color:#1a7a4a;font-size:14px;padding:10px 20px;letter-spacing:0.5px">📊 匯出 Excel</button>
    </div>
    <div class="total-block" style="text-align:right">
      <div class="lbl">報價總金額（含稅）</div>
      <div class="amt" id="grandTotal2" style="font-size:20px">$0</div>
      <div class="tax" id="taxBreak2"></div>
    </div>
  </div>
  <!-- 大項管理 Modal -->
  <div id="sectionMgrOverlay" onclick="if(event.target===this)closeSectionManager()" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:1000;align-items:center;justify-content:center">
    <div style="background:#fff;border-radius:12px;width:440px;max-height:80vh;display:flex;flex-direction:column;box-shadow:0 8px 32px rgba(0,0,0,0.2)">
      <div style="padding:16px 20px;border-bottom:1px solid #e0ddd5;display:flex;align-items:center;justify-content:space-between">
        <span style="font-weight:600;font-size:15px">大項管理</span>
        <button onclick="closeSectionManager()" style="background:none;border:none;font-size:22px;cursor:pointer;color:#aaa;line-height:1">×</button>
      </div>
      <div id="sectionMgrList" style="padding:10px 12px;overflow-y:auto;flex:1;max-height:50vh"></div>
      <div style="padding:12px;border-top:1px solid #e0ddd5;display:flex;gap:8px">
        <input id="sectionMgrInput" placeholder="輸入新大項名稱" onkeydown="if(event.key==='Enter')addCustomSection()" style="flex:1;padding:7px 10px;border:1px solid #e0ddd5;border-radius:6px;font-size:13px;outline:none">
        <button onclick="addCustomSection()" style="padding:7px 16px;background:#c0392b;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:13px">＋ 新增</button>
      </div>
    </div>
  </div>
  <div id="rightContent"></div>
  <div id="addCustomArea" class="add-custom" style="margin-top:8px">
    <input id="customName" placeholder="手動新增工項名稱" style="flex:1;min-width:160px"/>
    <input id="customUnit" placeholder="單位" style="width:70px"/>
    <input id="customPrice" placeholder="單價" type="number" style="width:100px"/>
    <select id="customCat"><option value="假設及拆運工程">假設及拆運工程</option><option value="水電／照明工程">水電／照明工程</option><option value="輕隔間及輕鋼架天花工程">輕隔間及輕鋼架天花工</option><option value="泥作及貼磚工程">泥作及貼磚工程</option><option value="木作及系統櫃工程">木作及系統櫃工程</option><option value="門扇工程">門扇工程</option><option value="鋁窗工程">鋁窗工程</option><option value="鐵件及金屬工程">鐵件及金屬工程</option><option value="油漆工程">油漆工程</option><option value="地坪工程">地坪工程</option><option value="玻璃及貼膜工程">玻璃及貼膜工程</option><option value="廣告及招牌工程">廣告及招牌工程</option><option value="窗簾工程">窗簾工程</option><option value="空調工程">空調工程</option><option value="衛浴設備工程">衛浴設備工程</option><option value="廚具設備工程">廚具設備工程</option><option value="燈具、設備及其他工程">燈具、設備及其他工程</option><option value="施工區域完工後清潔工程">施工區域完工後清潔工程</option><option value="設計製圖費">設計製圖費</option>    </select>
    <button class="btn btn-primary" onclick="addCustomItem()">新增</button>
  </div>
  <!-- 備註編輯區 -->
  <div id="remarksEditor" style="margin:8px 16px;padding:10px 12px;background:#fff;border:1px solid #e0ddd5;border-radius:8px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
      <span style="font-size:12px;font-weight:600;color:#444">備　註</span>
      <div style="display:flex;align-items:center;gap:8px">
        <span style="font-size:12px;color:#666">建議工期</span>
        <input id="projDuration" type="number" min="0" value="0" style="width:60px;font-size:12px;text-align:center" onchange="projDuration=parseInt(this.value)||0">
        <span style="font-size:12px;color:#666">天</span>
        <button onclick="addRemark()" style="font-size:11px;padding:2px 10px;background:#f0f7ff;border:1px solid #b8d4f5;border-radius:4px;cursor:pointer;color:#1a5fb4">＋新增備註</button>
      </div>
    </div>
    <div id="remarksList"></div>
  </div>
  <div class="bottom-bar">
    <div class="actions">
      <button class="btn" onclick="clearAll()">清除全部</button>
      <button class="btn" onclick="openDriveQuotes()" style="background:#f0f7ff;border-color:#b8d4f5;color:#1a5fb4">☁️ 雲端開啟</button>
      <button class="btn" onclick="saveQuoteToDrive()" style="background:#f0fff4;border-color:#b8e4c5;color:#1a7a4a">☁️ 雲端儲存</button>
      <button class="btn" onclick="exportJSON()" style="font-size:11px;color:#777">下載 JSON 備份</button>
      <button class="btn btn-primary" onclick="doPrint()">🖨️ 列印 PDF</button>
      <button class="btn" onclick="exportToExcel()" style="background:#1a7a4a;color:#fff;border-color:#1a7a4a">📊 匯出 Excel</button>
    </div>
    <div id="driveFileList" style="display:none;width:fit-content;max-width:100%;min-width:340px;padding:10px 12px;background:#fff;border:1px solid #dce8f5;border-radius:8px"><div style="font-size:12px;font-weight:600;color:#1a5fb4;margin-bottom:7px">公司 Google Drive 報價清單</div><input id="driveFileSearch" type="text" placeholder="搜尋檔名…" oninput="renderDriveFiles()" style="width:100%;box-sizing:border-box;font-size:12px;padding:5px 8px;margin-bottom:7px;border:1px solid #dce8f5;border-radius:4px"><div id="driveFiles"></div></div>
    <div id="selectionSumBlock" style="display:none;padding:6px 14px;background:#fffbf0;border:1px solid #f5c518;border-radius:6px;text-align:right;min-width:120px">
      <div style="font-size:10px;color:#999;margin-bottom:1px">選取加總</div>
      <div id="selectionSumAmt" style="font-size:15px;font-weight:700;color:#c0392b">$0</div>
      <div id="selectionSumCount" style="font-size:10px;color:#aaa"></div>
    </div>
    <div class="total-block">
      <div class="lbl">報價總金額（含稅）</div>
      <div class="amt" id="grandTotal">$0</div>
      <div class="tax" id="taxBreak"></div>
    </div>
  </div>
</div>
</div>
</div>

<div class="print-doc" id="printDoc"></div>

<script src="quotation/js/defaultitems.js?v=4c266bd2"></script>
<script src="quotation/js/items.js?v=4c266bd2"></script>
<script src="quotation/js/quote.js?v=4c266bd2"></script>
<script src="quotation/js/output.js?v=4c266bd2"></script>
<script src="quotation/js/app.js?v=4c266bd2"></script>
<script src="quotation/js/pwa.js?v=4c266bd2"></script>
<script src="quotation/js/mobile.js?v=4c266bd2"></script>
</div><!-- end mainApp -->
<script src="quotation/js/shell.js?v=4c266bd2"></script>
</body>
</html>
